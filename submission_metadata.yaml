methodology_summary: >
  6-layer cascade feeding a Mamdani Fuzzy Inference System. L1 hard-rejects
  fraudulent/impossible profiles via a local SQLite KB. L2 scores wholesome
  profile-to-JD similarity with a quantized MiniLM bi-encoder and gates to the
  top 55% (top 50% + random 5%). L3 applies a soft seniority-regression penalty.
  L4 independently scores work-description-to-JD relevance. L5 penalizes
  buzzword-heavy / incoherent project text (KenLM perplexity + buzzword density).
  L6 normalizes platform behavioral signals. L7 fuses all scores via fuzzy
  inference and polishes the top 50 with a FlashRank cross-encoder. JD parsing
  uses local Ollama Mistral for JD parsing (writes jd.json offline-consumed by the
  ranker); the final version swaps in a locally fine-tuned Qwen2.5-1.5B, keeping
  the ranking step fully offline, CPU-only, and under 5 minutes.

