# ============================================================================
# Approach summary (optional but recommended)
# ============================================================================
methodology_summary: |
  ≤200 word summary of your approach. Strongly recommended.

  
  "RedRob Ranking Cascade:
  
   L1a — Fraud/KB Hard Reject
  - KB verification: fictional companies, paper authorship mismatch → hard reject
  - Scores verified=1.0, unknown=0.5, fictional=0.0
  - Returns only `l1_status == 'pass'`

  L1b — Profile Integrity Hard Reject
  - Hard rejects: `reverse_degree_order`, `duplicate_job_descriptions`, `invalid_degree_field_combination`
  - Hard rejects: `willing_to_relocate=False`, `open_to_work_flag=False`
  - Pass → `l1b_penalty=1.0` (by design, not a bug)

  L1c — Explicit Skill Match
  - Synonym-expanded NLP match across skills + work + profile + projects
  - `l1c_score = (0.7×req_matched + 0.3×bonus_matched − 0.2×unmatched) / max_positive`, clamped [0,1]
  - Hard reject: zero explicit-required skill matches

  L1d — Inferred Skill Match (no reject)
  - Reuses L1c text scan, separates tool vs. non-tool inferred hits
  - `l1d_score = (inferred_matched − tools) / n_inferred`

  L2 — Table Extract
  - Builds 31-col `table_row` per candidate: exp, location, salary, skill scores, production/arch/testing KW scores, engagement signals, fabrication_bandwidth, soft-penalty flags

  L3 — Sugeno FIS`
  - 8 conditions a–h; formula:
  `l3_score = 0.40g + 0.20b + 0.10c + 0.10f + 0.05a + 0.05d + 0.05e − 0.05h`
  - No rejections; all candidates scored
  
  L4 — Semantic Work Relevance
  - Local all-MiniLM-L6-v2 (pre-cached, no network) encodes work-text vs JD responsibilities
  - Donts penalty: linear ramp  of donts-sim distribution

  L4b — Explicit-Req Penalty
  - Penalizes candidates with <4 `l1c_matched_required` skills
  "

