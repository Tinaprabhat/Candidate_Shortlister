methodology_summary: >
  7-layer cascade: folder pruning (heuristic token overlap) → L1 fraud hard-reject
  (SQLite KB) → L2 bi-encoder gate (MiniLM INT8, 55% pass) → L3 seniority soft
  penalty → L4 semantic work-to-JD relevance → L6 behavioral signals → L7 Mamdani
  FIS + FlashRank cross-encoder polish (top 50). JD parsing is a pre-computation
  step using Gemini API or local Ollama Mistral; rank.py reads data/jd.json and
  makes zero network calls. Fully offline, CPU-only, reproducible via single command.

constraints_met:
  runtime: "~51s measured on 100k candidates (budget: 300s)"
  memory: "~350 MB peak (budget: 16 GB)"
  disk: "~233 MB intermediate (budget: 5 GB)"
  gpu: "none — CPU only"
  network_during_ranking: "none — zero external calls in rank.py"
